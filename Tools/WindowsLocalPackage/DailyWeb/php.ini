; Standalone Daily Rewards uses only PHP core features and its own file bridge.
[PHP]
engine = On
short_open_tag = Off
expose_php = Off
enable_dl = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen
open_basedir = "${AOREBIRTH_LOCAL_DAILY_WEB_ROOT};${AOREBIRTH_LOCAL_DAILY_STATE_ROOT}"
user_ini.filename =
allow_url_fopen = Off
allow_url_include = Off
file_uploads = Off
sys_temp_dir = "${AOREBIRTH_LOCAL_DAILY_STATE_ROOT}/tmp"
date.timezone = UTC
default_charset = "UTF-8"
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = "${AOREBIRTH_LOCAL_DAILY_STATE_ROOT}/php-error.log"
zend.exception_ignore_args = On
max_execution_time = 10
max_input_time = 10
memory_limit = 64M
post_max_size = 32K
max_input_vars = 128
