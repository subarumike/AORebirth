<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>AORebirth</title>
  <style type="text/css">
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040a10;
    }
    table.fill {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
    }
    table.fill td {
      text-align: center;
      vertical-align: middle;
      background: #040a10;
    }
    img.logo {
      max-width: 100%;
      max-height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <table class="fill" cellpadding="0" cellspacing="0">
    <tr>
      <td>
        <img class="logo" src="images/aor-logo.png" alt="AORebirth" />
      </td>
    </tr>
  </table>
</body>
</html>
