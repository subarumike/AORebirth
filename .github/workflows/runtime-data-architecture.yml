name: Runtime data architecture

on:
  pull_request:
  push:
    branches:
      - master
      - 'codex/**'

permissions:
  contents: read

jobs:
  content-boundary:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify proposed runtime and catalog changes
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          $baseline = $env:PR_BASE
          if (-not $baseline) {
            if ($env:GITHUB_REF -eq 'refs/heads/master') {
              $baseline = $env:PUSH_BASE
            } else {
              $baseline = git merge-base origin/master HEAD
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          if ($baseline -notmatch '^[0-9a-f]{40}$' -or $baseline -match '^0+$') {
            throw 'The exact proposed-change base is unavailable.'
          }
          dotnet build Tools/NewEngineRuntimeContentGuard/NewEngineRuntimeContentGuard.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $guard = 'Tools/NewEngineRuntimeContentGuard/bin/Release/net10.0/NewEngineRuntimeContentGuard.dll'
          dotnet $guard --doa-self-test .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet $guard --enforce . $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s Tools/tests -p test_runtime_catalog_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s Tools/tests -p test_windows_release_contract.py -k test_pvp_and_pork_catalog_admission -k test_authoritative_catalog_validation -k test_hash_bound_prior_checkpoint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B Tools/runtime_catalog_contract.py --base $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $results = Join-Path $env:RUNNER_TEMP catalog-fixture-results
          dotnet test AORebirth/Server/ZoneEngine_New.Tests/ZoneEngine_New.Tests.csproj -m:1 -p:RuntimeCatalogFocusedTests=true --nologo --filter 'FullyQualifiedName~RuntimeCatalogTests.LegacyPvpTitlesResolveTheirTextCategoryAndAuthoredFallback' --results-directory $results --logger 'trx;LogFileName=catalog-fixture.trx'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$fixture = Get-Content -Raw (Join-Path $results catalog-fixture.trx)
          $counters = $fixture.TestRun.ResultSummary.Counters
          if ([int]$counters.executed -lt 1 -or [int]$counters.passed -ne [int]$counters.executed) {
            throw 'The production PvP reader fixture must execute and pass.'
          }
