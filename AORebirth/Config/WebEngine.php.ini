; AORebirth WebEngine PHP 8.5 CGI configuration.
; This file is copied into the validated runtime as php.ini by the offline
; runtime-supply workflow. Runtime-writable data stays outside that tree.

[PHP]
engine = On
short_open_tag = Off
expose_php = Off
enable_dl = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen
open_basedir = "${AOREBIRTH_WEBCORE_ROOT};${AOREBIRTH_PHP_STATE_DIR}"
user_ini.filename =

default_charset = "ISO-8859-1"
default_mimetype = "text/html"
date.timezone = "UTC"

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
error_log = "${AOREBIRTH_PHP_STATE_DIR}/log/php-error.log"
ignore_repeated_errors = On

max_execution_time = 30
max_input_time = 30
max_input_nesting_level = 32
max_input_vars = 512
memory_limit = 128M
post_max_size = 1M
request_order = "GP"
variables_order = "GPCS"
register_argc_argv = Off

allow_url_fopen = Off
allow_url_include = Off
file_uploads = Off
upload_tmp_dir = "${AOREBIRTH_PHP_STATE_DIR}/tmp"
upload_max_filesize = 1M
max_file_uploads = 0
sys_temp_dir = "${AOREBIRTH_PHP_STATE_DIR}/tmp"

extension_dir = "ext"
; DOM is built into the pinned PHP 8.5.9 runtime; there is no php_dom.dll.
extension = php_pdo_mysql.dll

[CGI]
; WebEngine sets REDIRECT_STATUS=200 before invoking php-cgi directly.
cgi.force_redirect = On
cgi.fix_pathinfo = Off
cgi.discard_path = On
cgi.nph = Off
fastcgi.impersonate = Off
fastcgi.logging = On

[Session]
session.save_handler = files
session.save_path = "${AOREBIRTH_PHP_STATE_DIR}/sessions"
session.use_strict_mode = On
session.use_cookies = On
session.use_only_cookies = On
session.use_trans_sid = Off
session.cookie_httponly = On
session.cookie_samesite = "Lax"
session.cookie_secure = Off
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440
